[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmcouncil"
version = "0.1.0"
description = "Multi-LLM council agent with Telegram + TUI interfaces"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    # Telegram
    "python-telegram-bot[job-queue]>=21.0",
    # TUI
    "textual>=0.70.0",
    # CLI / config
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
    # Secrets vault
    "pyrage>=1.0.0",
    "keyring>=25.0.0",
    # Persistence
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Logging
    "structlog>=24.1.0",
    # Web search
    "tavily-python>=0.3.0",
    # Async HTTP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "vcrpy>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "neovim>=0.3.1",
]

[project.scripts]
llmcouncil = "llmcouncil.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcouncil"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
